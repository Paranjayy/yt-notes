<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--fg:#1a1917;--fg-muted:#6b6560;--fg-faint:#a8a29e;--border:#e8e5e1;--accent:#b45309;--surface:#fff;--surface-raised:#f8f7f5}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#e7e5e4;--fg-muted:#a8a29e;--fg-faint:#57534e;--border:#292524;--accent:#f59e0b;--surface:#1c1917;--surface-raised:#292524}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-0.01em}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--fg-faint);border-radius:3px}
.paste-screen{max-width:640px;margin:0 auto;padding:80px 24px}
.paste-screen h1{font-size:36px;margin-bottom:12px}
.paste-screen p{color:var(--fg-muted);font-size:15px;margin-bottom:24px}
textarea{width:100%;padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--fg-faint)}
.paste-hint{margin-top:12px;font-size:12px;color:var(--fg-faint)}
.paste-actions{display:flex;align-items:center;gap:10px;margin-top:14px}.file-input{display:none}
.site-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100}
.site-header .logo{font-family:'Newsreader',Georgia,serif;font-size:18px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg-muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:flex;min-height:calc(100vh - 53px)}
.sidebar{width:280px;min-width:280px;border-right:1px solid var(--border);padding:16px 0;overflow-y:auto;max-height:calc(100vh - 53px);position:sticky;top:53px}
.sidebar-item{display:block;width:100%;text-align:left;padding:10px 20px;border:none;border-left:3px solid transparent;background:transparent;cursor:pointer;font-family:inherit;transition:all .12s}
.sidebar-item:hover{background:var(--surface-raised)}
.sidebar-item.active{border-left-color:var(--accent);background:var(--surface-raised)}
.sidebar-item .st{font-size:13px;font-weight:500;color:var(--fg);margin-bottom:2px;line-height:1.4}
.sidebar-item .sc{font-size:11px;color:var(--fg-faint)}
.main{flex:1;padding:40px 48px;max-width:800px}
@media(max-width:768px){.sidebar{display:none}.main{padding:24px 16px}}
.note-article{padding-bottom:48px;margin-bottom:48px;border-bottom:1px solid var(--border)}
.thumb{border-radius:8px;overflow:hidden;aspect-ratio:16/9;margin-bottom:20px;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{margin-bottom:24px}
.meta h2{font-size:24px;margin-bottom:12px;line-height:1.3}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--fg-muted)}
.meta-row span{display:flex;align-items:center;gap:5px}
.meta-row svg{width:13px;height:13px;flex-shrink:0}
.date-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--fg-faint);margin-top:8px}
.open-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border);transition:border-color .15s,color .15s}
.open-link:hover{border-bottom-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:2px 8px;border-radius:4px}
.section-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;margin-bottom:10px;font-family:inherit}
.section-toggle .label{font-size:13px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.section-toggle .count{font-size:11px;color:var(--fg-faint);font-family:'SF Mono',monospace}
.section-toggle .arrow{font-size:10px;color:var(--fg-faint);transition:transform .15s;display:inline-block}
.section-toggle .arrow.open{transform:rotate(90deg)}
.section-body{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;max-height:400px;overflow-y:auto}
.desc-body{font-size:14px;color:var(--fg-muted);line-height:1.7;white-space:pre-wrap;margin-bottom:24px}
.notes-callout{margin-bottom:24px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface-raised);border-radius:0 6px 6px 0;font-size:14px;line-height:1.6}
.notes-callout .nc-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px}
.notes-callout .nc-body{color:var(--fg-muted)}
.ts-line{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.7;color:var(--fg-muted)}
.ts-line:hover{color:var(--fg)}
.comment{border-left:2px solid var(--border);padding-left:14px;margin-bottom:16px;font-size:14px;line-height:1.6;transition:border-color .15s}
.comment:hover{border-left-color:var(--accent)}
.rec-card{display:flex;gap:12px;margin-bottom:16px;padding:10px;border-radius:8px;transition:background .12s;text-decoration:none;color:var(--fg)}
.rec-card:hover{background:var(--surface-raised)}
.rec-thumb{width:168px;min-width:168px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface)}
.rec-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rec-info{flex:1;min-width:0}
.rec-title{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-meta{font-size:12px;color:var(--fg-faint);line-height:1.4}
.rec-line{font-size:14px;line-height:1.6;color:var(--fg-muted);margin-bottom:4px}
.rec-link{font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border);transition:border-color .15s,color .15s}
.rec-link:hover{border-bottom-color:var(--accent)}
.rec-section{margin-bottom:24px}
.playlist-grid{display:grid;gap:8px}.playlist-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.playlist-row.unavailable{opacity:.62}.playlist-pos{font-family:'SF Mono',monospace;font-size:12px;color:var(--fg-faint)}.playlist-title{font-size:13px;font-weight:500;line-height:1.35}.playlist-sub{font-size:11px;color:var(--fg-faint);margin-top:2px}.playlist-link{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="pasteScreen" class="paste-screen">
  <h1>YT Notes</h1>
  <p>Paste your markdown export from the Social Companion extension to view it here. Supports single or multiple notes.</p>
  <textarea id="pasteInput" rows="14" placeholder="---&#10;Title: My Video&#10;Channel: Some Channel&#10;---&#10;&#10;# Transcript&#10;[0:00] Hello world...&#10;&#10;# Comments&#10;1. @user: Great video!"></textarea>
  <div class="paste-actions"><button class="btn" id="backupFileBtn">Import playlist backup</button><input class="file-input" id="backupFileInput" type="file" accept=".json,.csv,application/json,text/csv"></div>
  <p class="paste-hint">Paste Markdown or import a Social Companion playlist JSON/CSV backup. Everything stays in this browser.</p>
</div>

<div id="viewerScreen" style="display:none">
  <header class="site-header">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="logo">YT Notes</span>
      <span id="noteCount" style="font-size:12px;color:var(--fg-faint)"></span>
    </div>
    <button class="btn" id="newNoteBtn" style="display:none">New Note</button>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" style="display:none"></aside>
    <main id="mainContent" class="main"></main>
  </div>
</div>

<script>
function parseFrontmatter(md){var m=md.match(/^---\n([\s\S]*?)\n---/);if(!m)return[{},md];var fm={};m[1].split('\n').forEach(function(l){var i=l.indexOf(':');if(i>0)fm[l.slice(0,i).trim()]=l.slice(i+1).trim()});return[fm,md.slice(m[0].length)]}
function parseSections(b){var s={};b.split(/^# /m).filter(Boolean).forEach(function(p){var l=p.split('\n');s[l[0].trim().toLowerCase()]=l.slice(1).join('\n').trim()});return s}
function parseMultipleNotes(md){var n=[];md.split(/(?=^---$)/m).filter(function(s){return s.trim()}).forEach(function(c){try{var r=parseFrontmatter(c);if(r[0].Title)n.push({frontmatter:r[0],sections:parseSections(r[1]),raw:c})}catch(e){}});return n}
var ICO={eye:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',like:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>',msg:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',usr:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',arr:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'};
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function renderNote(note){
  var fm=note.frontmatter,s=note.sections;
  var v=(fm.URL||'').match(/v=([^&]+)/);var vid=v?v[1]:'';
  var th=fm.Thumbnail||(vid?'https://img.youtube.com/vi/'+vid+'/maxresdefault.jpg':'');
  var h='';
  if(th)h+='<div class="thumb"><img src="'+th+'" alt="'+esc(fm.Title||'')+'" loading="lazy"></div>';
  h+='<div class="meta"><h2>'+esc(fm.Title||'Untitled')+'</h2>';
  h+='<div class="meta-row">';
  if(fm.Channel)h+='<span>'+ICO.usr+' '+esc(fm.Channel)+'</span>';
  if(fm.Subscribers)h+='<span>'+esc(fm.Subscribers)+'</span>';
  if(fm.Views)h+='<span>'+ICO.eye+' '+esc(fm.Views)+'</span>';
  if(fm.Likes)h+='<span>'+ICO.like+' '+esc(fm.Likes)+'</span>';
  if(fm.Comments)h+='<span>'+ICO.msg+' '+esc(fm.Comments)+'</span>';
  h+='</div>';
  h+='<div class="date-row">';
  if(fm.Published)h+='<span>Published: '+esc(fm.Published)+'</span>';
  if(fm.Copied)h+='<span>Copied: '+esc(fm.Copied)+'</span>';
  h+='</div>';
  if(fm.URL)h+='<a href="'+fm.URL+'" target="_blank" rel="noopener" class="open-link">Open on YouTube '+ICO.arr+'</a>';
  h+='</div>';
  if(fm.Tags){h+='<div class="tags">';fm.Tags.split(',').forEach(function(t){h+='<span class="tag">'+esc(t.trim())+'</span>'});h+='</div>'}
  var desc=fm.Description||fm.description||'';
  if(desc)h+='<details open style="margin-bottom:24px"><summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Description</summary><div class="desc-body">'+esc(desc)+'</div></details>';
  var pn=s['personal notes & markers']||'';
  if(pn&&pn.indexOf('No notes added yet')===-1)h+='<div class="notes-callout"><div class="nc-label">Personal Notes</div><div class="nc-body">'+esc(pn)+'</div></div>';
  if(s['transcript']){var tl=s['transcript'].split('\n').filter(Boolean);h+='<div style="margin-bottom:24px"><button class="section-toggle" onclick="toggle(this)"><span class="label">Transcript</span><span class="count">'+tl.length+' lines</span><span class="arrow open">&#9654;</span></button><div class="section-body">';tl.forEach(function(l){h+='<div class="ts-line">'+esc(l)+'</div>'});h+='</div></div>'}
  if(s['comments']){var cl=s['comments'].split('\n').filter(Boolean);h+='<div style="margin-bottom:24px"><button class="section-toggle" onclick="toggle(this)"><span class="label">Comments</span><span class="count">'+cl.length+'</span><span class="arrow open">&#9654;</span></button><div class="section-body">';cl.forEach(function(l){h+='<div class="comment">'+l.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</div>'});h+='</div></div>'}
  if(s['recommendations']){
    var rl=s['recommendations'].split('\n').filter(Boolean);
    h+='<div class="rec-section"><button class="section-toggle" onclick="toggle(this)"><span class="label">Recommendations</span><span class="arrow open">&#9654;</span></button><div style="max-height:none;overflow:visible">';
    var recs=[];var cur=null;
    rl.forEach(function(l){
      if(/^\d+\./.test(l)){if(cur)recs.push(cur);cur={title:l.replace(/^\d+\.\s*\*\*/,'').replace(/\*\*.*$/,'').trim(),meta:'',url:'',thumb:'',raw:l}}
      else if(/^https?:\/\/.*img\.youtube\.com/.test(l.trim())){if(cur)cur.thumb=l.trim()}
      else if(/^https?:\/\//.test(l.trim())){if(cur)cur.url=l.trim()}
      else if(cur){cur.meta+=(cur.meta?' ':'')+l.trim()}
    });
    if(cur)recs.push(cur);
    recs.forEach(function(r){
      if(r.url&&r.thumb){
        h+='<a href="'+r.url+'" target="_blank" rel="noopener" class="rec-card">';
        h+='<div class="rec-thumb"><img src="'+r.thumb+'" loading="lazy"></div>';
        h+='<div class="rec-info"><div class="rec-title">'+esc(r.title)+'</div>';
        if(r.meta)h+='<div class="rec-meta">'+esc(r.meta)+'</div>';
        h+='</div></a>';
      } else {
        h+='<div class="rec-line">'+esc(r.raw||r.title)+'</div>';
        if(r.url)h+='<div><a href="'+r.url+'" target="_blank" rel="noopener" class="rec-link">'+esc(r.url)+'</a></div>';
      }
    });
    h+='</div></div>';
  }
  return '<article class="note-article" style="animation:fadeUp .4s ease-out both">'+h+'</article>';
}
function renderPlaylistBackup(backup){
  var items=backup.items||[];
  var h='<article class="note-article" style="animation:fadeUp .4s ease-out both"><div class="meta"><h2>'+esc(backup.title||'YouTube playlist backup')+'</h2><div class="date-row"><span>'+items.length+' videos</span>'+(backup.exportedAt?'<span>Exported: '+esc(backup.exportedAt.slice(0,10))+'</span>':'')+'</div>'+(backup.url?'<a href="'+esc(backup.url)+'" target="_blank" rel="noopener" class="open-link">Open playlist '+ICO.arr+'</a>':'')+'</div><div class="playlist-grid">';
  items.forEach(function(item,index){var unavailable=item.unavailable||!item.videoId;h+='<div class="playlist-row'+(unavailable?' unavailable':'')+'"><div class="playlist-pos">'+esc(String(item.position||index+1))+'</div><div><div class="playlist-title">'+esc(item.title||'Unavailable video')+'</div><div class="playlist-sub">'+esc([item.channel,item.duration,unavailable?'Unavailable/private':''].filter(Boolean).join(' · '))+'</div></div>'+(item.url?'<a class="playlist-link" href="'+esc(item.url)+'" target="_blank" rel="noopener">Open</a>':'<span class="playlist-link">Unavailable</span>')+'</div>'});
  return h+'</div></article>';
}
function toggle(btn){var body=btn.nextElementSibling,arrow=btn.querySelector('.arrow');if(body.style.display==='none'){body.style.display='';arrow.classList.add('open')}else{body.style.display='none';arrow.classList.remove('open')}}
var notes=[],sel=0;
function showViewer(){document.getElementById('pasteScreen').style.display='none';document.getElementById('viewerScreen').style.display='';document.getElementById('newNoteBtn').style.display=notes.length>1?'':'none';document.getElementById('noteCount').textContent=notes.length>1?notes.length+' notes':'';renderSidebar();renderMain()}
function showPaste(){document.getElementById('pasteScreen').style.display='';document.getElementById('viewerScreen').style.display='none'}
function renderSidebar(){var sb=document.getElementById('sidebar');if(notes.length<=1){sb.style.display='none';return}sb.style.display='';sb.innerHTML=notes.map(function(n,i){var title=n.kind==='playlist'?n.playlist.title:n.frontmatter.Title;var sub=n.kind==='playlist'?(n.playlist.items||[]).length+' videos':n.frontmatter.Channel;return '<button class="sidebar-item'+(i===sel?' active':'')+'" onclick="selectNote('+i+')"><div class="st">'+esc(title||'Untitled')+'</div><div class="sc">'+esc(sub||'')+'</div></button>'}).join('')}
function renderMain(){var mc=document.getElementById('mainContent');if(!notes.length){mc.innerHTML='';return}mc.innerHTML=notes[sel].kind==='playlist'?renderPlaylistBackup(notes[sel].playlist):renderNote(notes[sel])}
function selectNote(i){sel=i;renderSidebar();renderMain()}
document.getElementById('pasteInput').addEventListener('input',function(){var md=this.value.trim();if(!md){notes=[];showPaste();return}notes=parseMultipleNotes(md);if(!notes.length){try{var r=parseFrontmatter(md);if(r[0].Title)notes=[{frontmatter:r[0],sections:parseSections(r[1]),raw:md}]}catch(e){}}if(notes.length){sel=0;showViewer()}else{showPaste()}});
document.getElementById('newNoteBtn').addEventListener('click',showPaste);
function csvRows(text){var rows=[],row=[],field='',quoted=false;for(var i=0;i<text.length;i++){var ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){field+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(field);if(row.some(function(v){return v!==''}))rows.push(row);row=[];field=''}else field+=ch}if(field||row.length){row.push(field);rows.push(row)}return rows}
function importBackup(file){file.text().then(function(text){var backup;if(file.name.toLowerCase().endsWith('.json')){backup=JSON.parse(text)}else{var rows=csvRows(text),headers=rows.shift()||[];backup={title:file.name.replace(/\.csv$/i,''),exportedAt:new Date().toISOString(),items:rows.map(function(row){var item={};headers.forEach(function(header,i){item[header]=row[i]||''});item.position=Number(item.position)||0;item.unavailable=item.unavailable==='true'||!item.videoId;return item})}}if(!Array.isArray(backup.items))throw new Error('This is not a Social Companion playlist backup.');notes=[{kind:'playlist',playlist:backup}];sel=0;showViewer()}).catch(function(){alert('Could not read that backup. Choose a Social Companion playlist JSON or CSV file.')})}
document.getElementById('backupFileBtn').addEventListener('click',function(){document.getElementById('backupFileInput').click()});document.getElementById('backupFileInput').addEventListener('change',function(){if(this.files[0])importBackup(this.files[0])});
</script>
</body>
</html>
